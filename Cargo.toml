[package]
name = "tulisp-async"
version = "0.4.0"
edition = "2024"
description = "Runtime-agnostic async primitives for tulisp."
repository = "https://github.com/tulisp/tulisp-async"
license = "GPL-3.0-only"
rust-version = "1.88.0"
keywords = ["lisp", "emacs-lisp", "async", "tulisp"]
categories = ["asynchronous"]

[dependencies]
tulisp = { version = "0.32.0", features = ["sync"] }
tokio = { version = "1", features = ["rt", "time"], optional = true }

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dev-dependencies]
# `sync` is for `tokio::sync::mpsc` in the channel/rust_driver examples;
# the library proper doesn't need it.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[[example]]
name = "sleep"
path = "examples/sleep.rs"
required-features = ["tokio"]

[[example]]
name = "heartbeat"
path = "examples/heartbeat.rs"
required-features = ["tokio"]

[[example]]
name = "channel"
path = "examples/channel.rs"
required-features = ["tokio"]

[[example]]
name = "rust_driver"
path = "examples/rust_driver.rs"
required-features = ["tokio"]

[[example]]
name = "std_executor"
path = "examples/std_executor.rs"
